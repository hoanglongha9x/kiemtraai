name: PR01 submit review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key-for-build-only
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-kiemtraai-submit.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-kiemtraai-submit
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-kiemtraai-submit.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:demo'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:emulator
      - run: npm test
      - run: npm run test:emulator
